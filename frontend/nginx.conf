server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /home.html /index.html;
  }

  # /preco/ would otherwise match the build/preco/ directory and return 403.
  location ~ ^(?<route>/.+)/$ {
    try_files $route.html /index.html;
  }

  location / {
    try_files $uri $uri.html /index.html;
  }
}
