version: 2

models:
  - name: noisesource
    description: "Combined noise sources from Strasbourg terrasses and OSM data"
    columns:
      - name: label
        description: "Name of the establishment"
      - name: geometry
        description: "Geometry in EPSG:4326, type POINT"
      - name: category_slug
        description: "Category slug for the source, either 'REST' or 'BAR'"
