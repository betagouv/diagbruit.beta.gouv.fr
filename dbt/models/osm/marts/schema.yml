version: 2

models:
  - name: noisesource-2
    description: "National noise sources from Open Source Map"
    columns:
      - name: name
        description: "Name of the establishment"
      - name: type
        description: "Type of the establishment either 'restaurants' 'bar' 'pub'"
      - name: meta_code_dep
        description: "Department code"
      - name: geometry
        description: "Geometry in EPSG:4326, type POINT"
      - name: category_slug
        description: "Category slug for the source, either 'REST' or 'BAR'"
