name: Deploy to Scalingo
description: >
  Pousse un sous-dossier du monorepo sur une app Scalingo via git subtree et
  fait échouer le job si le build ou le démarrage Scalingo échoue.

inputs:
  app:
    description: Nom de l'app Scalingo (ex. diag-bruit-cms-preprod)
    required: true
  prefix:
    description: Sous-dossier du monorepo à déployer (ex. cms)
    required: true
  ssh-private-key:
    description: Clé SSH privée autorisée à pousser sur Scalingo
    required: true

runs:
  using: composite
  steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Add Scalingo to known_hosts
      shell: bash
      run: ssh-keyscan -p 22 ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

    - name: Deploy via git subtree
      shell: bash
      env:
        SCALINGO_APP: ${{ inputs.app }}
        SUBTREE_PREFIX: ${{ inputs.prefix }}
      run: bash "$GITHUB_ACTION_PATH/deploy.sh"
