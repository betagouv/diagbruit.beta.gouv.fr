name: 🚀 Deploy CMS → preprod

on:
  push:
    branches:
      - preprod
    paths:
      - "cms/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Strapi CMS to preprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SCALINGO_SSH_PRIVATE_KEY }}

      - name: Add Scalingo to known_hosts
        run: ssh-keyscan -p 22 ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

      - name: Deploy via git subtree
        run: |
          git remote add scalingo git@ssh.osc-fr1.scalingo.com:diag-bruit-cms-preprod.git
          git subtree push --prefix cms scalingo main
