name: 🚀 Deploy Metabase

on:
  push:
    branches:
      - main
    paths:
      - "metabase/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Metabase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Scalingo
        uses: ./.github/actions/scalingo-deploy
        with:
          app: diag-bruit-metabase
          prefix: metabase
          ssh-private-key: ${{ secrets.SCALINGO_SSH_PRIVATE_KEY }}
