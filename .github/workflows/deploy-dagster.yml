name: 🚀 Deploy Dagster

on:
  push:
    branches:
      - preprod
    paths:
      - "dagster/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Dagster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Scalingo
        uses: ./.github/actions/scalingo-deploy
        with:
          app: diag-bruit-dagster
          prefix: dagster
          ssh-private-key: ${{ secrets.SCALINGO_SSH_PRIVATE_KEY }}
