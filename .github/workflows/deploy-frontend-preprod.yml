name: 🚀 Deploy Frontend → preprod

on:
  push:
    branches:
      - preprod
    paths:
      - "frontend/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Frontend to preprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Scalingo
        uses: ./.github/actions/scalingo-deploy
        with:
          app: diag-bruit-front-preprod
          prefix: frontend
          ssh-private-key: ${{ secrets.SCALINGO_SSH_PRIVATE_KEY }}
