name: 🚀 Deploy FastAPI → preprod

on:
  push:
    branches:
      - preprod
    paths:
      - "fastapi/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy FastAPI to preprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Scalingo
        uses: ./.github/actions/scalingo-deploy
        with:
          app: diag-bruit-back-preprod
          prefix: fastapi
          ssh-private-key: ${{ secrets.SCALINGO_SSH_PRIVATE_KEY }}
