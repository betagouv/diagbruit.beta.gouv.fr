version: 2

sources:
  - name: public_workspace
    schema: public_workspace
    tables:
      - name: geo_departements
        description: "French departments with their respective geometries"
        columns:
          - name: code
            description: "Department code"
          - name: nom
            description: "Department name"
          - name: geometry
            description: "Geometry data in WKT format"
      - name: raw_noisemap
        description: "Raw noise map data imported from shapefiles"
        columns:
          - name: id
            description: "Noise zone ID"
          - name: idcbs
            description: "CBS ID"
          - name: uueid
            description: "UUID"
          - name: campaign
            description: "Year"
          - name: codedept
            description: "Department code"
          - name: acoustic_producer_kind
            description: "Territory type"
          - name: producer
            description: "Producer ID"
          - name: codeinfra
            description: "Infrastructure code"
          - name: kind
            description: "Source type"
          - name: acoustic_noisemap_kind
            description: "CBS type"
          - name: zonedef
            description: "Zone definition"
          - name: acoustic_db_value
            description: "Legend"
          - name: acoustic_time_range
            description: "Indicator type"
          - name: validedeb
            description: "Validity start date"
          - name: validefin
            description: "Validity end date"
          - name: geometry
            description: "Geometry data in WKT format"
