version: 2

models:
  - name: int_stras_slug
    description: "Strasbourg data with label and category slug"
    columns:
      - name: label
        description: "Label of the establishment (name | address)"
      - name: name
        description: "Name of the establishment"
      - name: geometry
        description: "Geometry in EPSG:4326, type POINT"
      - name: category_slug
        description: "Category slug for the source, either 'REST' or 'BAR'"
