version: 2

models:
  - name: int_noisezone_codedept
    description: "Enriches noise zone geometries with a department code inferred via spatial join against geo_departements"
    columns:
      - name: codedept
        description: "Department code (3 digits, left-padded with zeros) inferred from geometry intersection"
        tests:
          - not_null
      - name: label
        description: "Identifier or name of the noise zone"
        tests:
          - not_null
      - name: alert_slug
        description: "Slug used to link the zone to an alert or recommendation"
      - name: geometry
        description: "Geometry of the noise zone polygon"
        tests:
          - not_null
