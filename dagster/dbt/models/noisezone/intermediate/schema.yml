version: 2

models:
  - name: int_noisezone_validated
    description: "Validates geometry and provides validation information"
  - name: int_noisezone_fixed
    description: "Repairs invalid geometries and reports their post-repair validity"

  - name: int_noisezone_projected
    description: "Transforms geometries to EPSG:4326 (WGS84) coordinate system"
    columns:
      - name: alert_slug
        description: "Slug used to link the zone to an alert or recommendation"
      - name: geometry
        description: "Noise zone polygon geometry projected to EPSG:4326 (WGS84)"
        tests:
          - not_null
      - name: srid
        description: "Target SRID of the projected geometry (4326)"
      - name: original_srid
        description: "SRID of the source geometry before projection"
