version: 2

models:
  - name: noisemap
    description: >
      Clean noise map polygons with validated geometries. Each source contour is split
      into pieces of at most 256 vertices, so there are several rows per contour: group
      by `id` to recover a whole feature.
    columns:
      - name: id
        description: >
          Contour ID, shared by every piece of the same source contour — NOT unique.
          Minted before the split, so it is stable within a build.
      - name: campaign
        description: "Year"
      - name: codedept
        description: "Department code"
      - name: acoustic_producer_kind
        description: "Territory type (INFRA or AGGLO)"
      - name: label
        description: "Infrastructure code"
      - name: kind
        description: "Source type (F for railway, R for road)"
      - name: acoustic_noisemap_kind
        description: "CBS type (A, B, C priority zone)"
      - name: acoustic_db_value
        description: "Noise level in dB"
      - name: acoustic_time_range
        description: "Time range indicator (LD for day, LN for night)"
      - name: geometry
        description: "One subdivided piece of the contour, at most 256 vertices"
